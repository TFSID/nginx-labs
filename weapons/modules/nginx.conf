daemon off;
worker_processes 1;
error_log logs/error.log;
pid tmp/nginx.pid;
worker_rlimit_core 500M;
working_directory tmp;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    access_log off;

    # Expose server version (intentional — vulnerable target)
    server_tokens on;

    client_body_temp_path tmp;
    proxy_temp_path tmp;
    fastcgi_temp_path tmp;
    uwsgi_temp_path tmp;
    scgi_temp_path tmp;

    upstream backend {
        server 127.0.0.1:19323;
    }

    server {
        listen 19321;
        request_pool_size 7920;
        connection_pool_size 4096;
        client_header_buffer_size 2048;

        root /usr/share/nginx/html;
        index index.html;

        # stub_status exposed (misconfiguration)
        location /nginx_status {
            stub_status on;
            allow all;
        }

        # The rewrite + set combination triggers CVE-2026-42945:
        # - rewrite sets e->is_args = 1 (due to '?' in replacement)
        # - set $original_endpoint $1 allocates buffer using raw capture
        #   length, but copies with escape expansion (3x for '+' chars)
        location ~ ^/api/(.*)$ {
            rewrite ^/api/(.*)$ /internal?migrated=true;
            set $original_endpoint $1;
        }

        # Also vulnerable via /r/
        location ~ ^/r/(.*)$ {
            rewrite ^/r/(.*)$ /internal?migrated=true;
            set $original_endpoint $1;
        }

        location /internal {
            internal;
            proxy_pass http://backend;
            proxy_read_timeout 60s;
        }

        # Spray: POST body stored in pool memory (binary data, NUL bytes allowed)
        # client_body_in_single_buffer keeps body contiguous on the heap.
        # Backend delays for X-Delay seconds, keeping body allocated.
        location /spray {
            client_body_in_single_buffer on;
            proxy_pass http://backend;
            proxy_read_timeout 60s;
        }

        # Upload fallback spray target
        location /upload {
            client_body_in_single_buffer on;
            proxy_pass http://backend;
            proxy_read_timeout 60s;
            client_body_buffer_size 64k;
            client_max_body_size 64k;
        }

        location / {
            try_files $uri $uri/ =404;
        }

        # Admin panel (404 by default — for path discovery test)
        location /admin {
            return 403 "Forbidden";
        }

        # Fake .env exposure
        location /.env {
            return 200 "DB_HOST=db\nDB_PASS=secret123\nAPP_KEY=base64:abc123\n";
        }
    }
}
