user nginx;
worker_processes 1;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events { worker_connections 1024; }

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    server_tokens on;

    upstream backend {
        server 127.0.0.1:19323;
    }

    server {
        listen 80;
        server_name localhost;

        # The rewrite + set combination triggers CVE-2026-42945:
        # 1. rewrite sets e->is_args = 1 (due to '?' in replacement)
        # 2. set $original_endpoint $1 allocates buffer using raw capture length,
        #    but copies with escape expansion (3x for '+' chars), causing overflow.
        location ~ ^/api/(.*)$ {
            rewrite ^/api/(.*)$ /internal?migrated=true;
            set $original_endpoint $1;
        }

        location /internal {
            internal;
            proxy_pass http://backend;
            proxy_read_timeout 60s;
        }

        # Spray: POST body stored in pool memory
        location /spray {
            client_body_in_single_buffer on;
            proxy_pass http://backend;
            proxy_read_timeout 60s;
        }

        location / {
            return 200 "ok\n";
        }
    }
}