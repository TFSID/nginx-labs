services:
  nginx-vuln:
    image: nginx:1.25.3          # within CVE-2026-42945 affected range (< 1.30.1)
    container_name: ngixshell-lab
    ports:
      - "19321:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./server.py:/app/server.py:ro
      - ./entrypoint.sh:/app/entrypoint.sh:ro
    restart: unless-stopped