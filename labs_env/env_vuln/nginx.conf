daemon off;
worker_processes 1;
error_log logs/error.log;
pid tmp/nginx.pid;
worker_rlimit_core 500M;
working_directory tmp;

events {
    worker_connections 1024;
}

http {
    access_log off;
    client_body_temp_path tmp;
    proxy_temp_path tmp;
    fastcgi_temp_path tmp;
    uwsgi_temp_path tmp;
    scgi_temp_path tmp;
    server_tokens on;

    upstream backend {
        server 127.0.0.1:19323;
    }

    server {
        listen 19322;
        location / { return 200 "backend ok\n"; }
    }

    server {
        listen 19321;
        request_pool_size 7920;
        connection_pool_size 4096;
        client_header_buffer_size 2048;

        root /app/html;
        index index.html;

        # CVE-2026-42945 trigger: rewrite sets e->is_args = 1 (due to '?'),
        # set $original_endpoint $1 allocates buffer using raw capture length
        # but copies with escape expansion (3x for '+' chars)
        location ~ ^/api/(.*)$ {
            rewrite ^/api/(.*)$ /internal?migrated=true;
            set $original_endpoint $1;
        }

        location /internal {
            internal;
            proxy_pass http://backend;
            proxy_read_timeout 60s;
        }

        # Heap spray: POST body kept in pool memory
        location /spray {
            client_body_in_single_buffer on;
            proxy_pass http://backend;
            proxy_read_timeout 60s;
        }

        # Recon: stub_status exposed
        location /nginx_status {
            stub_status on;
            allow all;
        }

        # Recon: fake .env leak
        location /.env {
            return 200 "DB_HOST=db\nDB_PASS=secret123\nAPP_KEY=base64:abc123\n";
        }

        # Recon: admin panel
        location /admin {
            return 403 "Forbidden";
        }

        location / {
            try_files $uri $uri/ =404;
        }
    }
}
